<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Four Moves</title>
  <style>
    :root {
      --bg: #fffcf9;
      --ink: #1e293b;
      --muted: #64748b;
      --blue: #4e89bd;
      --red: #e06c75;
      --green: #3f8f5a;
      --gold: #d79b2b;
      --line: #e2dcd3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Inter, system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    h1 { margin: 24px 24px 0; font-size: 1.6rem; text-align: center; }

    .stage {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 24px;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 24px;
      align-items: center;
    }

    /* Code panel with a highlighted line */
    .code {
      border: 3px solid var(--blue);
      border-radius: 14px;
      background: white;
      padding: 14px 0;
      font-family: Consolas, monospace;
      font-size: 1.02rem;
      overflow-x: auto;
    }

    .line {
      padding: 3px 18px;
      white-space: pre;
      border-left: 6px solid transparent;
      transition: background 0.3s, border-color 0.3s;
    }

    .line.on { background: #fff1cc; border-left-color: var(--gold); }
    .line.bug { background: #fbe1e3; border-left-color: var(--red); }

    .right { display: flex; flex-direction: column; gap: 16px; }

    /* Where things live */
    .zone {
      position: relative;
      border-radius: 14px;
      padding: 34px 14px 14px;
      min-height: 110px;
      transition: border-color 0.3s, background 0.3s;
    }

    .zone .tag {
      position: absolute;
      top: 8px;
      left: 14px;
      font-weight: 700;
      color: var(--muted);
    }

    .js-zone { border: 3px dashed var(--line); }
    .js-zone.lit { border-color: var(--gold); background: #fffaf0; }

    .page-zone { border: 3px solid var(--ink); background: white; }
    .page-zone.lit { box-shadow: 0 0 0 7px #cfe2f3; border-color: var(--blue); }
    .page-zone .id { font-family: Consolas, monospace; color: var(--blue); font-weight: 400; }

    .holder, .area { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }

    .area {
      min-height: 64px;
      border: 2px dashed transparent;
      border-radius: 10px;
      padding: 6px;
      transition: border-color 0.3s;
    }

    .page-zone.lit .area { border-color: var(--blue); }

    /* A made element: raw until it gets classes */
    .made {
      min-width: 90px;
      min-height: 44px;
      padding: 4px 8px;
      border: 2px dotted var(--muted);
      font-family: Consolas, monospace;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .made.styled {
      border: 2px solid var(--ink);
      border-radius: 10px;
      padding: 10px 16px;
      background: white;
      color: var(--ink);
      font-family: Inter, system-ui, sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      box-shadow: 0 2px 6px rgba(30, 41, 59, 0.12);
    }

    .made.fresh { animation: pop 0.45s ease-out; }
    @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .boxes { display: flex; gap: 14px; flex-wrap: wrap; }

    .box {
      flex: 1;
      min-width: 140px;
      border: 3px solid var(--ink);
      border-radius: 12px;
      background: white;
      padding: 8px 14px;
      text-align: center;
    }

    .box .k { color: var(--muted); font-weight: 700; }
    .box .v { font-family: Consolas, monospace; font-size: 1.25rem; font-weight: 700; min-height: 1.5em; }
    .box.ok .v { color: var(--green); }
    .box.err { border-color: var(--red); }
    .box.err .v { color: var(--red); font-size: 0.95rem; }

    .caption {
      max-width: 900px;
      margin: 0 auto 8px;
      padding: 0 24px;
      min-height: 4.5em;
      font-size: 1.5rem;
      text-align: center;
    }

    code { font-family: Consolas, monospace; background: #f1ede7; padding: 1px 6px; border-radius: 4px; }

    .controls { display: flex; justify-content: center; align-items: center; gap: 16px; padding: 0 24px 24px; }

    .controls button {
      padding: 10px 24px;
      font: inherit;
      font-weight: 700;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: white;
      cursor: pointer;
    }

    .controls #next { background: var(--ink); color: white; }
    .controls button:disabled { opacity: 0.35; cursor: default; }
    .count { color: var(--muted); }

    @media (max-width: 860px) {
      .stage { grid-template-columns: 1fr; }
      .code { font-size: 0.85rem; }
      .caption { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <h1>Making an element: 4 moves</h1>

  <div class="stage">
    <div class="code" id="code"></div>

    <div class="right">
      <div class="zone js-zone" id="js-zone">
        <span class="tag">In JavaScript only (not on the page)</span>
        <div class="holder" id="holder"></div>
      </div>

      <div class="zone page-zone" id="page-zone">
        <span class="tag">The page: <span class="id">&lt;div id="card-area"&gt;</span></span>
        <div class="area" id="area"></div>
      </div>

      <div class="boxes">
        <div class="box" id="box-item"><div class="k">item</div><div class="v" id="v-item">–</div></div>
        <div class="box" id="box-console"><div class="k">Console</div><div class="v" id="v-console">–</div></div>
      </div>
    </div>
  </div>

  <p class="caption" id="caption"></p>

  <div class="controls">
    <button id="back" type="button">← Back</button>
    <span class="count" id="count"></span>
    <button id="next" type="button">Next →</button>
  </div>

  <script>
    const oneCard = [
      'const area = document.getElementById("card-area");',
      "",
      'const card = document.createElement("div");',
      'card.className = "card p-3";',
      'card.textContent = "Taco";',
      "area.appendChild(card);"
    ];
    const loopCode = [
      'const area = document.getElementById("card-area");',
      "",
      "menu.forEach(function (item) {",
      '  const card = document.createElement("div");',
      '  card.className = "card p-3";',
      "  card.textContent = item.name;",
      "  area.appendChild(card);",
      "});"
    ];
    const noAppend = [
      'const area = document.getElementById("card-area");',
      "",
      "menu.forEach(function (item) {",
      '  const card = document.createElement("div");',
      '  card.className = "card p-3";',
      "  card.textContent = item.name;",
      "});"
    ];
    const hashId = [
      'const area = document.getElementById("#card-area");',
      "",
      "menu.forEach(function (item) {",
      '  const card = document.createElement("div");',
      '  card.className = "card p-3";',
      "  card.textContent = item.name;",
      "  area.appendChild(card);",
      "});"
    ];

    // A card: { text, styled }. held = cards made but not on the page. page = cards on the page.
    const blank = { text: "", styled: false };
    const styled = { text: "", styled: true };
    function c(text) { return { text: text, styled: true }; }

    // Each step: caption, code + highlighted line, what's held, what's on the page, the boxes.
    const steps = [
      { text: "The page has an empty box: <code>&lt;div id=\"card-area\"&gt;</code>. Let's fill it with JavaScript.",
        code: oneCard },
      { text: "First, <strong>find</strong> the box. <code>getElementById</code> takes the id, with <strong>no #</strong>. Now <code>area</code> is that box.",
        code: oneCard, line: 0, pageLit: true },
      { text: "<strong>Move 1: make it.</strong> <code>createElement(\"div\")</code> makes a brand-new div. It's empty, and it's <strong>not on the page yet</strong>.",
        code: oneCard, line: 2, held: [blank], fresh: true },
      { text: "<strong>Move 2: classes.</strong> <code>className</code> gives it Bootstrap classes: <code>card p-3</code>. Now it looks like a card.",
        code: oneCard, line: 3, held: [styled] },
      { text: "<strong>Move 3: text.</strong> <code>textContent</code> puts words inside. Still only in JavaScript.",
        code: oneCard, line: 4, held: [c("Taco")] },
      { text: "<strong>Move 4: put it on the page.</strong> <code>appendChild</code> puts the card inside <code>area</code>. Now you can see it!",
        code: oneCard, line: 5, page: [c("Taco")], pageLit: true, fresh: true, ok: true },
      { text: "Now put the 4 moves inside <code>forEach</code>. The function runs once for <strong>every item</strong> on the menu.",
        code: loopCode, line: 2 },
      { text: "Round 1: <code>item</code> is the Taco. Make, classes, text, append.",
        code: loopCode, line: 6, item: "Taco", page: [c("Taco")], pageLit: true, fresh: true },
      { text: "Round 2: <code>item</code> is the Burrito. Same 4 moves, a <strong>new</strong> card.",
        code: loopCode, line: 6, item: "Burrito", page: [c("Taco"), c("Burrito")], pageLit: true, fresh: true },
      { text: "Round 3: Nachos. <strong>One card for every item</strong>, and we wrote the 4 moves only once.",
        code: loopCode, line: 6, item: "Nachos", page: [c("Taco"), c("Burrito"), c("Nachos")], pageLit: true, fresh: true, ok: true },
      { text: "<strong>Bug hunt:</strong> this code has no move 4. <strong>Predict:</strong> what's on the page? Is there an error? Type it in the chat.",
        code: noAppend, line: 5, bug: true },
      { text: "The cards are made, but they stay in JavaScript. The page is empty, and there's <strong>no error</strong>. Nothing is broken, it just never got appended.",
        code: noAppend, line: 5, bug: true, item: "Nachos", held: [c("Taco"), c("Burrito"), c("Nachos")], ok: true, fresh: true },
      { text: "<strong>Bug hunt 2:</strong> look at the first line. <strong>Predict:</strong> what's on the page? Is there an error?",
        code: hashId, line: 0, bug: true },
      { text: "There's no id <code>#card-area</code>, so <code>area</code> is <code>null</code>. The page is empty, and you get a <strong>red error</strong>. <strong>No # in getElementById.</strong>",
        code: hashId, line: 6, bug: true, item: "Taco", held: [c("Taco")], err: "TypeError: Cannot read properties of null (reading 'appendChild')" }
    ];

    function el(id) { return document.getElementById(id); }

    function cardHtml(card, fresh) {
      const cls = "made" + (card.styled ? " styled" : "") + (fresh ? " fresh" : "");
      const text = card.text || (card.styled ? "" : "&lt;div&gt;&lt;/div&gt;");
      return '<div class="' + cls + '">' + text + "</div>";
    }

    // Only the newest card gets the pop animation.
    function fill(id, cards, fresh) {
      el(id).innerHTML = cards.map(function (card, n) {
        return cardHtml(card, fresh && n === cards.length - 1);
      }).join("");
    }

    let step = 0;

    function show() {
      const s = steps[step];

      el("code").innerHTML = "";
      s.code.forEach(function (text, n) {
        const line = document.createElement("div");
        line.className = "line" + (n === s.line ? (s.bug ? " bug" : " on") : "");
        line.textContent = text || " ";
        el("code").appendChild(line);
      });

      const held = s.held || [];
      const page = s.page || [];
      fill("holder", held, s.fresh && held.length > 0);
      fill("area", page, s.fresh && page.length > 0);
      el("js-zone").classList.toggle("lit", held.length > 0);
      el("page-zone").classList.toggle("lit", !!s.pageLit);

      el("v-item").textContent = s.item || "–";

      const con = el("v-console");
      con.textContent = s.err ? s.err : (s.ok ? "no error ✔" : "–");
      el("box-console").classList.toggle("ok", !!s.ok && !s.err);
      el("box-console").classList.toggle("err", !!s.err);

      el("caption").innerHTML = s.text;
      el("count").textContent = (step + 1) + " / " + steps.length;
      el("back").disabled = step === 0;
      el("next").disabled = step === steps.length - 1;
    }

    el("next").addEventListener("click", function () { if (step < steps.length - 1) { step++; show(); } });
    el("back").addEventListener("click", function () { if (step > 0) { step--; show(); } });
    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") el("next").click();
      if (e.key === "ArrowLeft") el("back").click();
    });

    show();
  </script>
</body>
</html>
